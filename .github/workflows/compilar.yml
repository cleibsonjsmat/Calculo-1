name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main  # Se a sua branch principal for 'master', mude aqui para master

# Permissões necessárias para o GitHub Pages publicar o site
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que deploys simultâneos não se atropelem
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    # Define o ambiente correto do GitHub Pages para evitar o erro de 'Missing environment'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Compilar todos os arquivos LaTeX (.tex) para PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          glob_root_file: true
          continue_on_error: true

      - name: Configurar estrutura do GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compactar e preparar os arquivos compilados (HTML/PDF/TXT)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4