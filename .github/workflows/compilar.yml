name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar todos os arquivos LaTeX em PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "**/*.tex"
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Organizar arquivos e gerar a Home Page Dinamica
        run: |
          mkdir -p public
          
          # Copia todos os PDFs mantendo a estrutura exata das pastas do PC
          find . -name "*.pdf" -not -path "./public/*" | while read -r pdf; do
              dir=$(dirname "$pdf" | sed 's|^\./||')
              filename=$(basename "$pdf")
              if [ "$dir" = "." ]; then
                  mkdir -p "public/Geral"
                  cp "$pdf" "public/Geral/$filename"
              else
                  mkdir -p "public/$dir"
                  cp "$pdf" "public/$dir/$filename"
              fi
          done

          # Início do HTML
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Prof. Cleibson Silva | IFPE Caruaru</title>
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
              <style>
                  :root {
                      --primary-green: #0f8b44;
                      --primary-dark: #09592b;
                      --bg-gray: #f8fafc;
                      --card-bg: #ffffff;
                      --text-main: #1e293b;
                      --text-muted: #64748b;
                      --border-color: #e2e8f0;
                  }
                  
                  * { box-sizing: border-box; margin: 0; padding: 0; }

                  body {
                      font-family: 'Inter', system-ui, -apple-system, sans-serif;
                      background-color: var(--bg-gray);
                      color: var(--text-main);
                      line-height: 1.6;
                      min-height: 100vh;
                      display: flex;
                      flex-direction: column;
                  }

                  header {
                      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-green) 100%);
                      color: white;
                      padding: 45px 20px 55px 20px;
                      text-align: center;
                      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                  }

                  header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 6px; }
                  header p.subtitle { font-size: 1.1rem; font-weight: 300; opacity: 0.95; }
                  header p.campus {
                      display: inline-block;
                      margin-top: 12px;
                      background: rgba(255, 255, 255, 0.15);
                      padding: 4px 14px;
                      border-radius: 20px;
                      font-size: 0.85rem;
                      font-weight: 600;
                      text-transform: uppercase;
                      letter-spacing: 0.03em;
                  }

                  main.container {
                      max-width: 900px;
                      width: 100%;
                      margin: -25px auto 40px auto;
                      padding: 0 20px;
                      flex: 1;
                  }

                  .card {
                      background: var(--card-bg);
                      border-radius: 12px;
                      padding: 26px;
                      margin-bottom: 24px;
                      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
                      border: 1px solid var(--border-color);
                  }

                  .card h2 {
                      font-size: 1.3rem;
                      color: var(--primary-dark);
                      margin-bottom: 12px;
                      border-bottom: 2px solid #f1f5f9;
                      padding-bottom: 8px;
                  }

                  .card p { color: var(--text-muted); font-size: 0.98rem; }

                  /* Navegação por Abas (Tabs) */
                  .tabs-nav {
                      display: flex;
                      gap: 8px;
                      border-bottom: 2px solid var(--border-color);
                      margin-bottom: 20px;
                      overflow-x: auto;
                      padding-bottom: 4px;
                  }

                  .tab-btn {
                      background: none;
                      border: none;
                      padding: 10px 18px;
                      font-family: inherit;
                      font-size: 0.95rem;
                      font-weight: 600;
                      color: var(--text-muted);
                      cursor: pointer;
                      border-radius: 6px 6px 0 0;
                      transition: all 0.2s;
                      white-space: nowrap;
                  }

                  .tab-btn:hover {
                      color: var(--primary-green);
                      background: #f1f5f9;
                  }

                  .tab-btn.active {
                      color: var(--primary-green);
                      border-bottom: 3px solid var(--primary-green);
                      background: #ffffff;
                  }

                  .tab-content { display: none; }
                  .tab-content.active { display: block; }

                  .pdf-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                      gap: 14px;
                  }

                  .pdf-card {
                      display: flex;
                      align-items: center;
                      justify-content: space-between;
                      background: #f8fafc;
                      border: 1px solid var(--border-color);
                      border-radius: 8px;
                      padding: 14px 16px;
                      text-decoration: none;
                      color: var(--text-main);
                      transition: all 0.2s ease;
                  }

                  .pdf-card:hover {
                      border-color: var(--primary-green);
                      background: #ffffff;
                      transform: translateY(-2px);
                      box-shadow: 0 4px 12px rgba(15, 139, 68, 0.08);
                  }

                  .pdf-info {
                      display: flex;
                      align-items: center;
                      gap: 10px;
                      overflow: hidden;
                  }

                  .pdf-name {
                      font-weight: 600;
                      font-size: 0.92rem;
                      white-space: nowrap;
                      overflow: hidden;
                      text-overflow: ellipsis;
                  }

                  .btn-download {
                      background-color: var(--primary-green);
                      color: white;
                      font-size: 0.72rem;
                      font-weight: 700;
                      padding: 5px 10px;
                      border-radius: 4px;
                      text-transform: uppercase;
                  }

                  footer {
                      background: #ffffff;
                      border-top: 1px solid var(--border-color);
                      text-align: center;
                      padding: 20px;
                      color: var(--text-muted);
                      font-size: 0.85rem;
                  }
              </style>
          </head>
          <body>

              <header>
                  <h1>Prof. Cleibson Silva</h1>
                  <p class="subtitle">Licenciatura em Matemática e Cursos Técnicos</p>
                  <p class="campus">IFPE — Campus Caruaru</p>
              </header>

              <main class="container">
                  
                  <div class="card">
                      <h2>📌 Apresentação</h2>
                      <p>Selecione a disciplina abaixo para visualizar as listas de exercícios, roteiros e materiais didáticos em PDF.</p>
                  </div>

                  <div class="card">
                      <div class="tabs-nav" id="tabs-header">
EOF

          # Cria as abas de forma dinamica baseada nos diretorios que contem PDFs
          first=true
          for folder in public/*/; do
              if [ -d "$folder" ]; then
                  foldername=$(basename "$folder")
                  tab_id=$(echo "$foldername" | iconv -t ascii//TRANSLIT | sed -e 's/[^a-zA-Z0-9]/_/g')
                  
                  if [ "$first" = true ]; then
                      echo "                          <button class=\"tab-btn active\" onclick=\"openTab(event, '$tab_id')\">📁 $foldername</button>" >> public/index.html
                      first=false
                  else
                      echo "                          <button class=\"tab-btn\" onclick=\"openTab(event, '$tab_id')\">📁 $foldername</button>" >> public/index.html
                  fi
              fi
          done

          cat << 'EOF' >> public/index.html
                      </div>
EOF

          # Cria o conteudo de cada aba dinamica
          first=true
          for folder in public/*/; do
              if [ -d "$folder" ]; then
                  foldername=$(basename "$folder")
                  tab_id=$(echo "$foldername" | iconv -t ascii//TRANSLIT | sed -e 's/[^a-zA-Z0-9]/_/g')
                  
                  if [ "$first" = true ]; then
                      echo "                      <div id=\"$tab_id\" class=\"tab-content active\"><div class=\"pdf-grid\">" >> public/index.html
                      first=false
                  else
                      echo "                      <div id=\"$tab_id\" class=\"tab-content\"><div class=\"pdf-grid\">" >> public/index.html
                  fi

                  for pdf in "$folder"*.pdf; do
                      if [ -f "$pdf" ]; then
                          relpath=$(echo "$pdf" | sed 's|^public/||')
                          filename=$(basename "$pdf")
                          echo "                          <a href=\"$relpath\" target=\"_blank\" class=\"pdf-card\">" >> public/index.html
                          echo "                              <div class=\"pdf-info\"><span>📄</span><span class=\"pdf-name\">$filename</span></div>" >> public/index.html
                          echo "                              <span class=\"btn-download\">Abrir</span>" >> public/index.html
                          echo "                          </a>" >> public/index.html
                      fi
                  done

                  echo "                      </div></div>" >> public/index.html
              fi
          done

          cat << 'EOF' >> public/index.html
                  </div>

              </main>

              <footer>
                  <p><strong>Instituto Federal de Pernambuco — Campus Caruaru</strong></p>
                  <p>Desenvolvido com LaTeX & GitHub Pages</p>
              </footer>

              <script>
                  function openTab(evt, tabName) {
                      var i, tabcontent, tablinks;
                      tabcontent = document.getElementsByClassName("tab-content");
                      for (i = 0; i < tabcontent.length; i++) {
                          tabcontent[i].style.display = "none";
                          tabcontent[i].classList.remove("active");
                      }
                      tablinks = document.getElementsByClassName("tab-btn");
                      for (i = 0; i < tablinks.length; i++) {
                          tablinks[i].classList.remove("active");
                      }
                      document.getElementById(tabName).style.display = "block";
                      document.getElementById(tabName).classList.add("active");
                      evt.currentTarget.classList.add("active");
                  }
              </script>

          </body>
          </html>
          EOF

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4