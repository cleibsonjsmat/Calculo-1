name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar arquivos LaTeX individualmente
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: |
            *.tex
            */*.tex
            */*/*.tex
          work_in_root_file_dir: true
          args: -pdf -interaction=nonstopmode

      - name: Organizar PDFs nas pastas do Public
        run: |
          mkdir -p public

          # Procura todas as pastas de disciplinas da raiz (ex: Cálculo 1, Matemática 6)
          find . -maxdepth 1 -type d -not -path "." -not -path "./.git" -not -path "./.github" -not -path "./public" -not -name "*build" | while IFS= read -r dir_path; do
              dir_name=$(basename "$dir_path")
              
              # Procura arquivos .pdf dentro da disciplina (incluindo subpastas build)
              find "$dir_path" -name "*.pdf" | while IFS= read -r pdf; do
                  filename=$(basename "$pdf")
                  
                  # Copia para a estrutura pública
                  mkdir -p "public/$dir_name"
                  cp "$pdf" "public/$dir_name/$filename"
                  echo "Copiado: $pdf -> public/$dir_name/$filename"
              done
          done

          # Mostra a estrutura gerada no log para diagnóstico
          echo "=== Conteúdo da pasta public ==="
          ls -R public/

          # Corrige quebras de linha de Windows (CRLF -> LF) e dá permissão de execução
          sed -i 's/\r$//' .github/gerar_html.sh
          chmod +x .github/gerar_html.sh

          # Executa o gerador do index.html
          bash .github/gerar_html.sh

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4