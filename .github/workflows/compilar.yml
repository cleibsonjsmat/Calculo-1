name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar arquivos LaTeX em PDF
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: |
            *.tex
            */*.tex
            */*/*.tex
          args: -pdf -interaction=nonstopmode

      - name: Organizar arquivos para a Home Page
        run: |
          mkdir -p public
          
          # Procura todos os PDFs gerados no repositório
          find . -name "*.pdf" -not -path "./public/*" -not -path "./.git/*" | while IFS= read -r pdf; do
              # Extrai o caminho sem o prefixo ./
              rel_path=$(echo "$pdf" | sed 's|^\./||')
              
              # Pega a primeira pasta do caminho (nome da disciplina)
              discipline=$(echo "$rel_path" | cut -d'/' -f1)
              filename=$(basename "$pdf")
              
              # Ignora arquivos que estejam soltos na raiz ou em pastas do sistema
              if [ "$discipline" = "$filename" ] || [[ "$discipline" == .* ]] || [ "$discipline" = "public" ]; then
                  continue
              fi
              
              # Limpa o sufixo 'build' caso o nome da disciplina tenha pegado 'build'
              clean_discipline=$(echo "$discipline" | sed 's|build$||')
              
              # Copia o PDF para a pasta limpa da disciplina dentro do public
              mkdir -p "public/$clean_discipline"
              cp "$pdf" "public/$clean_discipline/$filename"
          done

          # Executa o gerador de HTML
          bash .github/gerar_html.sh

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4