name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar arquivos LaTeX em PDF
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: |
            *.tex
            */*.tex
            */*/*.tex
          args: -pdf -interaction=nonstopmode

      - name: Organizar arquivos para a Home Page
        run: |
          mkdir -p public
          
          # Procura PDFs dentro de subpastas e copia mantendo o nome da disciplina
          find . -mindepth 2 -name "*.pdf" -not -path "./public/*" -not -path "./.git/*" | while IFS= read -r pdf; do
              # Pega a pasta pai real do arquivo
              dir=$(echo "$pdf" | cut -d'/' -f2)
              
              # Ignora pastas de compilação ou de sistema
              if [[ "$dir" == *"build"* ]] || [[ "$dir" == .* ]]; then
                  continue
              fi
              
              filename=$(basename "$pdf")
              mkdir -p "public/$dir"
              cp "$pdf" "public/$dir/$filename"
          done

          # Executa o gerador de HTML
          bash .github/gerar_html.sh

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4