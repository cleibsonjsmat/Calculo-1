name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar ambiente LaTeX no servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-lang-portuguese texlive-fonts-recommended

      - name: Compilar arquivos .tex e Organizar no Public
        run: |
          mkdir -p public

          # Varre cada pasta de disciplina
          find . -maxdepth 1 -type d -not -path "." -not -path "./.git" -not -path "./.github" -not -path "./public" -not -name "*build" | while IFS= read -r dir_path; do
              dir_name=$(basename "$dir_path")
              echo "--- Processando disciplina: $dir_name ---"
              
              # Entra na pasta da disciplina para compilar localmente
              cd "$dir_path" || continue
              
              # Procura e compila cada arquivo .tex da pasta
              find . -maxdepth 2 -name "*.tex" | while IFS= read -r texfile; do
                  echo "Compilando: $texfile"
                  pdflatex -interaction=nonstopmode "$texfile" || true
              done
              
              # Volta para a raiz do repositório
              cd - > /dev/null

              # Copia todos os PDFs gerados para a pasta public/NOME_DA_DISCIPLINA
              find "$dir_path" -name "*.pdf" | while IFS= read -r pdf; do
                  filename=$(basename "$pdf")
                  mkdir -p "public/$dir_name"
                  cp "$pdf" "public/$dir_name/$filename"
                  echo "Copiado para o site: public/$dir_name/$filename"
              done
          done

          # Ajusta o script do HTML e executa
          sed -i 's/\r$//' .github/gerar_html.sh
          chmod +x .github/gerar_html.sh
          bash .github/gerar_html.sh

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4