name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar arquivos LaTeX em PDF
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: |
            *.tex
            */*.tex
            */*/*.tex
          args: -pdf -interaction=nonstopmode

      - name: Organizar arquivos e gerar a Home Page Dinamica
        run: |
          mkdir -p public
          
          # Copia PDFs mantendo pastas
          find . -name "*.pdf" -not -path "./public/*" | while IFS= read -r pdf; do
              dir=$(dirname "$pdf" | sed 's|^\./||')
              filename=$(basename "$pdf")
              if [ "$dir" = "." ]; then
                  mkdir -p "public/Geral"
                  cp "$pdf" "public/Geral/$filename"
              else
                  mkdir -p "public/$dir"
                  cp "$pdf" "public/$dir/$filename"
              fi
          done

          # Gera o index.html usando o script auxiliar
          bash .github/gerar_html.sh

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4