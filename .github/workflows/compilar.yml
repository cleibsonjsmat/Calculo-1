name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main  # ou master, dependendo da sua branch principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    # ESTA É A LINHA CHAVE QUE CORRIGE O ERRO DE MISSING ENVIRONMENT:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Compilar arquivos LaTeX para PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            Calculo1/**/*.tex
          continue_on_error: true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dos artefatos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # Envia todo o conteúdo do repositório (com os PDFs gerados)

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4