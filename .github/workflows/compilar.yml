name: Compilar LaTeX e Gerar Abas Dinamicas

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar arquivos LaTeX em PDF
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: |
            *.tex
            */*.tex
            */*/*.tex
          args: -pdf -interaction=nonstopmode

      - name: Organizar arquivos para a Home Page
        run: |
          mkdir -p public

          # Mapeia todas as pastas do projeto (exceto .git, .github, public e *build)
          find . -maxdepth 1 -type d -not -path "." -not -path "./.git" -not -path "./.github" -not -path "./public" -not -name "*build" | while IFS= read -r dir_path; do
              dir_name=$(basename "$dir_path")
              
              # Procura arquivos .pdf gerados dentro desta disciplina (incluindo subpastas build)
              find "$dir_path" -name "*.pdf" | while IFS= read -r pdf; do
                  filename=$(basename "$pdf")
                  
                  # Copia o PDF para public/NOME_DA_DISCIPLINA
                  mkdir -p "public/$dir_name"
                  cp "$pdf" "public/$dir_name/$filename"
              done
          done

          # Executa o gerador do index.html
          bash .github/gerar_html.sh

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4