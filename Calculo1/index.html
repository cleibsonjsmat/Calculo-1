<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo 1 - Materiais</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        h1 { color: #2c3e50; }
        h2 { border-bottom: 2px solid #3498db; color: #2980b9; margin-top: 30px; }
        ul { list-style-type: none; padding-left: 0; }
        li { margin-bottom: 8px; }
        a { text-decoration: none; color: #2980b9; font-weight: bold; }
        a:hover { text-decoration: underline; color: #16a085; }
    </style>
</head>
<body>

    <h1>📚 Discipline: Cálculo 1</h1>

    <h2>📂 Slides das Aulas</h2>
    <div id="container-slides"><p>Carregando...</p></div>

    <h2>📝 Listas de Exercícios</h2>
    <div id="container-listas"><p>Carregando...</p></div>

    <h2>🎥 Aulas</h2>
    <div id="container-aulas"><p>Carregando...</p></div>

    <h2>📄 Provas Antigas</h2>
    <div id="container-provas"><p>Carregando...</p></div>

    <script>
      function carregarLinks(nomeArquivo, idContainer) {
        // O '?v=' evita que o navegador pegue a versão antiga do arquivo em cache
        fetch(nomeArquivo + '?v=' + new Date().getTime())
          .then(resposta => {
            if (!resposta.ok) throw new Error('Não foi possível encontrar: ' + nomeArquivo);
            return resposta.text();
          })
          .then(texto => {
            const container = document.getElementById(idContainer);
            
            // Remove o \r do Windows antes de quebrar as linhas
            const linhas = texto.replace(/\r/g, '').trim().split('\n');
            
            let html = '<ul>';
            let temConteudo = false;

            linhas.forEach(linha => {
              const linhaLimpa = linha.trim();
              if (linhaLimpa !== '') {
                temConteudo = true;
                
                // Divide a linha apenas na PRIMEIRA ocorrência do '|'
                const indicePipe = linhaLimpa.indexOf('|');
                
                let titulo = 'Material';
                let url = linhaLimpa;

                if (indicePipe !== -1) {
                  titulo = linhaLimpa.substring(0, indicePipe).trim();
                  url = linhaLimpa.substring(indicePipe + 1).trim();
                }

                html += `<li>📄 <a href="${url}" target="_blank" rel="noopener noreferrer">${titulo}</a></li>`;
              }
            });

            html += '</ul>';
            container.innerHTML = temConteudo ? html : '<p><i>Nenhum material cadastrado ainda.</i></p>';
          })
          .catch(erro => {
            console.error('Erro na seção ' + idContainer + ':', erro);
            document.getElementById(idContainer).innerHTML = '<p><i>Sem materiais nesta seção.</i></p>';
          });
      }

      // Usamos o caminho a partir da pasta da disciplina
      carregarLinks('/Calculo1/Slides/links.txt', 'container-slides');
      carregarLinks('/Calculo1/Listas/links.txt', 'container-listas');
      carregarLinks('/Calculo1/Aulas/links.txt', 'container-aulas');
      carregarLinks('/Calculo1/Provas/links.txt', 'container-provas');
    </script>

</body>
</html>
